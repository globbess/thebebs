<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bebs Arcade · Lonis &amp; Andrea</title>
<meta name="description" content="Penalties past Lonis, a whole closet to dress up, chess, and more. Little games for the wedding.">
<!-- the preview when the link is shared: the two of us on the dance floor, under the mirror ball -->
<meta property="og:title" content="The Bebs Arcade">
<meta property="og:description" content="Little games for Lonis &amp; Andrea's wedding. Get on the high scores.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thebebs.com/arcade/">
<meta property="og:image" content="https://thebebs.com/arcade/share.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Lonis and Andrea, in dots, on a black-and-white dance floor by the lake under a mirror ball, with the words The Bebs Arcade">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Questrial&display=swap">
<link rel="stylesheet" href="arcade.css?v=25">
<script>
  /* light or dark: the guest's choice on thebebs.com if they've made one, otherwise their phone's */
  (function () {
    var r = document.documentElement, t = null;
    try { t = localStorage.getItem('la-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    r.classList.add(t);
  })();
  /* the site's landscape behind the arcade (art.js, in its arcade mode); arcade.js moves it */
  window.ART_EMBED = { scene: 0.7, night: false, disco: true, taps: true };
</script>
</head>
<body>
<canvas id="art" aria-hidden="true"></canvas>

<div class="topbar">
  <a class="chip" href="/" id="home-link">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    thebebs.com
  </a>
  <div class="topbar-right">
  <nav class="lang-mini chip" aria-label="Language" data-tr-aria="Language">
    <button type="button" data-lang="en" lang="en" aria-label="English">EN</button>
    <button type="button" data-lang="sv" lang="sv" aria-label="Svenska">SV</button>
    <button type="button" data-lang="es" lang="es" aria-label="Español">ES</button>
  </nav>
  <button class="chip round theme-btn" id="theme-btn" type="button" aria-label="Switch light or dark" data-tr-aria="Switch light or dark">
    <svg class="i-sun" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .9v2.2M8 12.9v2.2M.9 8h2.2M12.9 8h2.2M3 3l1.5 1.5M11.5 11.5L13 13M13 3l-1.5 1.5M4.5 11.5L3 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg class="i-moon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.6 10.4A6 6 0 0 1 5.6 2.4a6 6 0 1 0 8 8z" fill="currentColor"/></svg>
  </button>
  </div>
</div>

<main class="menu" id="menu">
  <section class="hero" aria-label="Arcade" data-tr-aria="Arcade">
    <canvas id="hero-art" aria-hidden="true"></canvas>
    <div class="hero-text">
      <h1 data-tr>The Bebs Arcade</h1>
      <!-- everyone's best: a pop-up like the screen of an old arcade machine (arcade.js) -->
      <button class="hs-open" id="hs-open" type="button" aria-haspopup="dialog" aria-controls="hs-pop"><span data-tr>Hi scores</span></button>
    </div>
  </section>

  <ul class="games" id="games"></ul>
  <p class="foot" data-tr>June 12, 2027 · Rösås, Bäckaby</p>
</main>

<!-- the hi scores: every game's top 5, on a little arcade screen (arcade.js) -->
<dialog class="hs-pop" id="hs-pop" aria-labelledby="hs-pop-title">
  <div class="hs-screen">
    <button class="hs-x" type="button" aria-label="Close" data-tr-aria="Close">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <h2 class="hs-big" id="hs-pop-title" data-tr>Hi scores</h2>
    <div class="hs-game">
      <button class="hs-prev" type="button" aria-label="Previous game" data-tr-aria="Previous game"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M9 1.5v9L2 6z" fill="currentColor"/></svg></button>
      <p class="hs-gname" aria-live="polite"></p>
      <button class="hs-next" type="button" aria-label="Next game" data-tr-aria="Next game"><svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M3 1.5v9L10 6z" fill="currentColor"/></svg></button>
    </div>
    <table class="hs-table">
      <thead><tr><th class="r"><span class="vh" data-tr>Place</span></th><th class="n" data-tr>Player</th><th class="s" data-tr>Score</th></tr></thead>
      <tbody class="hs-rows"></tbody>
    </table>
    <p class="hs-none" data-tr>No scores yet. Be the first!</p>
    <button class="hs-start" type="button" data-tr>Press start</button>
    <p class="hs-free" aria-hidden="true" data-tr>Free play</p>
  </div>
</dialog>

<section class="play" id="play" hidden aria-labelledby="play-title">
  <div class="stage" id="stage">
    <canvas id="stage-cv"></canvas>
  </div>
  <div class="play-bar">
    <button class="chip" id="play-back" type="button">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-tr>Arcade</span>
    </button>
    <h2 class="play-title" id="play-title"></h2>
    <div class="hud" id="hud" aria-live="polite"></div>
  </div>
  <div class="strip" id="strip"></div>
  <div class="panel" id="panel"></div>
</section>

<script src="lang-sv.js?v=3"></script>
<script src="lang-es.js?v=3"></script>
<script src="lang.js?v=1"></script>
<script src="../art.js?v=117"></script>
<script>window.TRACK_OPEN = 'Opened: Arcade';</script>
<script src="../track.js?v=5"></script>
<script src="hiscores.js?v=6"></script>
<script src="dots.js?v=2"></script>
<script src="bebs.js?v=9"></script>
<script src="arcade.js?v=30"></script>
<script src="list.js?v=11"></script>
<script src="run.js?v=37"></script>
<script src="kick.js?v=14"></script>
<script src="sun.js?v=9"></script>
<script src="chess-engine.js?v=1"></script>
<script src="wardrobe.js?v=13"></script>
<script src="closet.js?v=5"></script>
<script src="dress.js?v=23"></script>
<script src="chess.js?v=12"></script>
<script src="trivia.js?v=17"></script>
<script src="song.js?v=2"></script>
<script>Arcade.boot();</script>
</body>
</html>
